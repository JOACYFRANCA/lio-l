/* --- Extração do PDF (EXTRACAO-INICIO) --- */
function median(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[b.length>>1]}
function modeR(a,step){const m={};let best=null,bc=0;for(const v of a){const k=Math.round(v/step)*step;m[k]=(m[k]||0)+1;if(m[k]>bc){bc=m[k];best=k}}return best}
const TERM=/[.!?:;»"”)\]…]$/;
function joinL(a,t){return /[A-Za-zÀ-ÿ]-$/.test(a)&&/^[a-zà-ÿ]/.test(t)?a.slice(0,-1)+t:a+" "+t}
async function readLines(page){
  const vp=page.getViewport({scale:1}),tc=await page.getTextContent();
  const it=[];
  for(const i of tc.items){if(typeof i.str!=="string"||!i.str.trim())continue;
    const h=Math.abs(i.transform[3])||Math.abs(i.transform[0])||i.height||10;
    it.push({s:i.str,x:i.transform[4],y:i.transform[5],h,w:i.width||0})}
  it.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const i of it){let L=null;
    for(let k=lines.length-1;k>=Math.max(0,lines.length-3);k--){const l=lines[k];if(Math.abs(l.y-i.y)<Math.max(1.5,Math.min(l.h,i.h)*0.5)){L=l;break}}
    if(!L){L={y:i.y,h:i.h,items:[]};lines.push(L)}
    L.items.push(i)}
  for(const L of lines){L.items.sort((a,b)=>a.x-b.x);let t="",end=null;
    for(const i of L.items){if(end!==null&&i.x-end>i.h*0.2&&!/\s$/.test(t)&&!/^\s/.test(i.s))t+=" ";t+=i.s;end=i.x+i.w}
    L.t=t.replace(/\s+/g," ").trim();L.x0=L.items[0].x;L.x1=end;L.h=median(L.items.map(i=>i.h))}
  lines.sort((a,b)=>b.y-a.y);
  return {lines:lines.filter(l=>l.t),H:vp.height};
}
function analisar(raw,from,to){
  const pgs=Object.keys(raw).map(Number).sort((a,b)=>a-b);
  const hs=[];for(const p of pgs)for(const l of raw[p].lines)for(let k=0;k<Math.min(l.t.length,200);k+=20)hs.push(l.h);
  const body=modeR(hs,0.5)||10;
  const key=t=>t.toLowerCase().replace(/\d+/g,"#").replace(/\s+/g," ").trim();
  const cnt={};
  for(const p of pgs){const L=raw[p].lines;new Set([...L.slice(0,2),...L.slice(-2)].map(l=>key(l.t))).forEach(k=>cnt[k]=(cnt[k]||0)+1)}
  const rep=Math.max(2,Math.ceil(pgs.length*0.3));
  const gaps=[],tmp={};
  for(const p of pgs){
    const L=raw[p].lines.filter((l,i,a)=>{const edge=i<2||i>=a.length-2,k=key(l.t);
      if(edge&&(/^[#\s\-–—|.]*$/.test(k)||(pgs.length>2&&cnt[k]>=rep)))return false;
      if(/^\d{1,3}$/.test(l.t)&&l.h<body*0.85)return false;return true});
    let cut=L.length;
    for(let i=L.length-1;i>=0;i--){const l=L[i];if(l.h<body*0.9&&l.y<raw[p].H*0.45)cut=i;else break}
    const marca=l=>/^\(?\d{1,3}\)?[\s.]/.test(l.t)||/^[*†]/.test(l.t);
    while(cut<L.length&&!marca(L[cut]))cut++;
    const noteL=L.slice(cut),bodyL=L.slice(0,cut);
    const notes=[];
    for(const l of noteL){if(/^\(?\d{1,3}\)?[\s.]/.test(l.t)||/^[*†]/.test(l.t)||!notes.length)notes.push(l.t);else notes[notes.length-1]=joinL(notes[notes.length-1],l.t)}
    tmp[p]={bodyL,notes};
    for(let i=1;i<bodyL.length;i++){const a=bodyL[i-1],b=bodyL[i];if(Math.abs(a.h-b.h)<0.6&&a.y>b.y)gaps.push(a.y-b.y)}
  }
  const typ=median(gaps)||body*1.4;
  const pages={},scanned=[];
  for(const p of pgs){
    const {bodyL,notes}=tmp[p];
    const chars=bodyL.reduce((s,l)=>s+l.t.length,0),letters=bodyL.reduce((s,l)=>s+(l.t.match(/[A-Za-zÀ-ÿ]/g)||[]).length,0);
    if(chars<120||letters/Math.max(1,chars)<0.55){scanned.push(p);pages[p]={pars:[],notes:[],scan:true};continue}
    const norm1=bodyL.filter(l=>Math.abs(l.h-body)<1).map(l=>l.x0);
    const left=modeR(norm1.length?norm1:bodyL.map(l=>l.x0),2);
    const xs=bodyL.map(l=>l.x1).sort((a,b)=>a-b),right=xs[Math.floor(xs.length*0.9)]||0;
    const pars=[];let cur=null,prev=null,prevBlock=false;
    bodyL.forEach((l,i)=>{
      const ind=l.x0-left,gapB=prev?prev.y-l.y:Infinity,nx=bodyL[i+1],gapA=nx?l.y-nx.y:Infinity;
      const small=l.h<body*0.92;
      const block=ind>body*5||(small&&ind>body*0.8);
      const first=!block&&ind>body*0.8&&ind<=body*5;
      const head=!block&&l.t.length<150&&(l.h>=body*1.12||(l.t.length<90&&!TERM.test(l.t)&&!/,$/.test(l.t)&&gapB>typ*1.5&&gapA>typ*1.3&&/^[A-ZÀ-Ý0-9]/.test(l.t)));
      const nw=!cur||head||cur.h||gapB>typ*1.45||first||(block&&!prevBlock)||(!block&&prevBlock)||(prev&&TERM.test(prev.t)&&prev.x1<right-body*2.5);
      if(nw){cur={t:l.t,h:head,q:block};pars.push(cur)}else cur.t=joinL(cur.t,l.t);
      prev=l;prevBlock=block;
    });
    pages[p]={pars,notes};
  }
  return {pages,scanned,from,to};
}
function partirLongo(t){
  if(t.length<=3500)return [t];
  const fr=t.match(/[^.!?]+[.!?]+["”»)]?\s*|[^.!?]+$/g)||[t],out=[];let c="";
  for(const f of fr){if(c.length+f.length>2200&&c.length>800){out.push(c.trim());c=""}c+=f}
  if(c.trim())out.push(c.trim());return out;
}
function achatar(ext){
  const pars=[],notas=[];
  for(let p=ext.from;p<=ext.to;p++){const pg=ext.pages[p];if(!pg)continue;
    pg.pars.forEach((x,i)=>{const t=String(x.t||"").replace(/\s+/g," ").trim();if(t.length<3)return;const last=pars[pars.length-1];
      if(x.h&&last&&last.h&&last.pg===p){last.t+=" "+t;return}
      if(i===0&&last&&!last.h&&!x.h&&!TERM.test(last.t)){last.t=joinL(last.t,t);return}
      const o={t,pg:p};if(x.h)o.h=true;if(x.q)o.q=true;pars.push(o)});
    arr(pg.notes).forEach(n=>{const t=String(n).trim();if(t)notas.push({t,pg:p})});
  }
  const out=[];for(const p of pars){if(p.h){out.push(p);continue}for(const t of partirLongo(p.t))out.push({...p,t})}
  return {pars:out,notas};
}
function seccionar(pars,notas){
  const S=[];let cur=null,len=0;
  const novo=t=>{cur={titulo:t||"",pars:[]};S.push(cur);len=0};
  for(const p of pars){
    if(p.h){if(!cur||len>=1500)novo(p.t);else if(!cur.titulo)cur.titulo=p.t;else cur.pars.push(p);continue}
    if(!cur)novo("");
    if(len+p.t.length>7000&&len>=2500)novo("");
    cur.pars.push(p);len+=p.t.length;
  }
  let out=S.filter(s=>s.pars.some(p=>!p.h));
  if(out.length>1){const last=out[out.length-1],tam=last.pars.reduce((s,p)=>s+p.t.length,0);
    if(tam<1200){out[out.length-2].pars.push(...(last.titulo?[{t:last.titulo,pg:last.pars[0].pg,h:true}]:[]),...last.pars);out.pop()}}
  out.forEach((s,i)=>{const pg=s.pars.map(p=>p.pg);s.pgIni=Math.min(...pg);s.pgFim=Math.max(...pg);s.titulo=s.titulo||("Trecho "+(i+1));s.notas=notas.filter(n=>n.pg>=s.pgIni&&n.pg<=s.pgFim);s.n=i});
  return out;
}

async function abrirPdf(f){

    if(/^\(?anonymous\)?$|^untitled|^sem t[ií]tulo|^documento?\d*$/i.test(t))t="";
    est.nv={pdf,nome:f.name,n:pdf.numPages,titulo:(t&&t.length>3?t:f.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ")).trim()};estNovo();
  }catch(e){const m=e&&e.name==="PasswordException"?"Este PDF tem senha. Remova a proteção e tente de novo.":e&&e.message==="pdfjs"?"Não foi possível carregar o leitor de PDF. Verifique a conexão e tente de novo.":"Não foi possível abrir este PDF.";
    if($("#st"))$("#st").textContent=m}

async function lerEscaneadas(){const nv=est.nv,pgs=nv.ext.scanned.slice(0,CAP.imgMax);
  const ctl=new AbortController();$("#ocr").disabled=true;$("#ocrStop").hidden=false;$("#ocrStop").onclick=()=>ctl.abort();
  try{const blobs=[];
    for(const p of pgs){$("#ost").innerHTML=`<span class="spin"></span>Preparando a imagem da página ${p}…`;
      const page=await nv.pdf.getPage(p),v1=page.getViewport({scale:1}),vp=page.getViewport({scale:Math.min(2.5,1500/v1.width)});
      const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      blobs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)))}
    $("#ost").innerHTML='<span class="spin"></span>O Claude está lendo as páginas (pode levar um ou dois minutos)…';
    const r=await CAP.sample.json(`As ${pgs.length} imagens são as páginas ${pgs.join(", ")} (nesta ordem) de um documento que o usuário anexou para estudo pessoal. Transcreva o texto de cada página fielmente, sem corrigir, resumir ou comentar. Separe os parágrafos; junte palavras hifenizadas no fim da linha; omita cabeçalhos, rodapés repetidos e números de página; coloque as notas de rodapé à parte. Marque títulos e citações recuadas.
Responda apenas com JSON neste formato:
{"paginas":[{"pagina":12,"paragrafos":[{"texto":"...","titulo":false,"citacao":false}],"notas":["1 ..."]}]}`,{images:blobs,signal:ctl.signal,cache:false});
    let ok=0;
    for(const x of arr(r&&r.paginas)){const p=+x.pagina;if(!pgs.includes(p))continue;
      const pars=arr(x.paragrafos).map(y=>({t:String(y&&y.texto||""),h:!!(y&&y.titulo),q:!!(y&&y.citacao)})).filter(y=>y.t.trim());
      if(!pars.length)continue;nv.ext.pages[p]={pars,notes:arr(x.notas).map(String)};nv.ext.scanned=nv.ext.scanned.filter(q=>q!==p);ok++}
    if(nv.edit)toast("As correções feitas à mão foram substituídas pela nova leitura.");
    montarSecoes();nv.edit=false;toast(ok?`${ok} página${ok>1?"s":""} lida${ok>1?"s":""}.`:"O Claude não conseguiu ler essas páginas.");estNovo();
  }catch(e){if($("#ost"))$("#ost").textContent=e&&e.code==="cancelled"?"Leitura interrompida.":sampleMsg(e);if($("#ocr"))$("#ocr").disabled=false;if($("#ocrStop"))$("#ocrStop").hidden=true}
}

function promptSecao(S){
  const ps=S.pars.map((p,i)=>p.h?`## ${p.t}`:`[P${i+1}] (p. ${p.pg})${p.q?" [citação recuada]":""} ${p.t}`).join("\n\n");

  return `Você prepara exercícios de leitura ativa para um estudante que precisa compreender e memorizar um texto denso, a partir de um trecho que ele está estudando. Use SOMENTE o trecho abaixo. Escreva em português do Brasil, com frases curtas e diretas.

Responda apenas com um objeto JSON neste formato:
{"ideias":[{"p":1,"certa":"...","erradas":["...","..."]}],
 "labirinto":[{"frase":"...","nucleo":"...","erradas":["...","..."]}],
 "vozes":{"lista":[{"id":"autor","nome":"O autor do texto"},{"id":"v1","nome":"Sobrenome"}],"afirmacoes":[{"texto":"...","voz":"v1","p":2}],"relacoes":[{"voz":"v1","relacao":"concorda","resumo":"..."}]},
 "argumento":[{"texto":"...","papel":"tese","p":1}],
 "cronologia":[{"ano":"1932","evento":"...","p":3}],
 "termos":[{"termo":"...","sentido":"...","p":2}]}

Regras:
- ideias: uma entrada para cada parágrafo [Pn] com mais de 40 palavras. "certa" resume a ideia central em até 20 palavras. As duas "erradas" têm tamanho e tom parecidos com a certa e são plausíveis para quem leu mal (um detalhe secundário tomado como central, uma inversão da posição do autor), mas são falsas ou secundárias para quem leu bem.
- labirinto: até 3 frases do trecho com 30 palavras ou mais, copiadas EXATAMENTE. "nucleo" é a oração principal reduzida a sujeito + verbo + complemento, com palavras da própria frase. As duas "erradas" são informações das orações secundárias da mesma frase.
- vozes: inclua só autores, obras, documentos ou grupos mencionados explicitamente no trecho, além do autor do texto (id "autor"). Use o sobrenome como nome, como aparece no trecho. Dê de 3 a 6 afirmações curtas parafraseadas, cada uma atribuída a quem a sustenta. Em relacoes, "relacao" é uma destas: "concorda", "discorda", "concorda em parte", "usa como fonte", "usa como exemplo". Se o trecho não cita ninguém, use listas vazias.
- argumento: de 4 a 7 itens parafraseados que reconstroem o raciocínio do trecho; "papel" é "tese", "premissa", "evidencia" ou "conclusao"; exatamente uma tese. Se o trecho for só descritivo, use lista vazia.
- cronologia: só acontecimentos com data escrita no trecho; lista vazia se houver menos de 3.
- termos: de 3 a 6 conceitos ou termos técnicos usados no trecho; "sentido" explica, em até 25 palavras, como ESTE texto usa o termo.
- "p" é sempre o número do parágrafo [Pn] de onde vem a informação.

TRECHO:
${ps}${ns}`}
function validar(g,S){
  g=g&&typeof g==="object"?g:{};
  const full=norm(S.pars.map(p=>p.t).join(" ")+" "+S.notas.map(n=>n.t).join(" "));
  const nP=S.pars.length,okP=p=>Number.isInteger(+p)&&+p>=1&&+p<=nP&&!S.pars[+p-1].h;
  let desc=0;const conta=(a,b)=>{desc+=a.length-b.length;return b};
  const id0=arr(g.ideias);
  const ideias=conta(id0,id0.filter(x=>x&&okP(x.p)&&str(x.certa)&&arr(x.erradas).filter(str).length>=2)).map(x=>({i:+x.p-1,ok:x.certa.trim(),no:x.erradas.filter(str).slice(0,2).map(s=>s.trim())}));
  const lab0=arr(g.labirinto);
  const lab=conta(lab0,lab0.filter(x=>{if(!x||!str(x.frase)||!str(x.nucleo)||arr(x.erradas).filter(str).length<2)return false;
    if(!full.includes(norm(x.frase)))return false;
    const fw=new Set(x.frase.split(/\s+/).map(norm)),nw=x.nucleo.split(/\s+/).map(norm).filter(w=>w.length>=4);
    return nw.length>0&&nw.filter(w=>fw.has(w)).length/nw.length>=0.7})).slice(0,3).map(x=>({frase:x.frase.trim(),ok:x.nucleo.trim(),no:x.erradas.filter(str).slice(0,2)}));
  let vozes=null;const v=g.vozes||{};
  const vl=arr(v.lista).filter(x=>x&&str(x.id)&&str(x.nome)&&(x.id==="autor"||(()=>{const ws=x.nome.split(/\s+/).map(norm).filter(w=>w.length>=3);return ws.some(w=>full.includes(w))})()));
  desc+=arr(v.lista).length-vl.length;
  if(!vl.some(x=>x.id==="autor"))vl.unshift({id:"autor",nome:"O autor do texto"});
  const ids=new Set(vl.map(x=>x.id));
  const af=arr(v.afirmacoes).filter(x=>x&&str(x.texto)&&ids.has(x.voz));
  const rel=arr(v.relacoes).filter(x=>x&&ids.has(x.voz)&&x.voz!=="autor"&&str(x.resumo));
  if(vl.length>=2&&af.length>=2&&new Set(af.map(x=>x.voz)).size>=2)vozes={lista:vl.map(x=>({id:x.id,nome:x.nome.trim()})),af:af.map(x=>({t:x.texto.trim(),v:x.voz,p:okP(x.p)?+x.p-1:null})),rel:rel.map(x=>({v:x.voz,r:String(x.relacao||"").trim(),t:x.resumo.trim()}))};
  const a0=arr(g.argumento).filter(x=>x&&str(x.texto)&&PAPEIS[x.papel]);
  const arg=a0.length>=3&&a0.some(x=>x.papel==="tese")?a0.map(x=>({t:x.texto.trim(),r:x.papel,p:okP(x.p)?+x.p-1:null})):null;
  const c0=arr(g.cronologia);
  const crono=conta(c0,c0.filter(x=>x&&str(String(x.ano||""))&&str(x.evento)&&full.includes(norm(x.ano)))).map(x=>({a:String(x.ano).trim(),e:x.evento.trim(),p:okP(x.p)?+x.p-1:null}));
  const t0=arr(g.termos);
  const termos=conta(t0,t0.filter(x=>x&&str(x.termo)&&str(x.sentido)&&full.includes(norm(x.termo)))).map(x=>({termo:x.termo.trim(),sentido:x.sentido.trim(),p:okP(x.p)?+x.p-1:null}));
  return {ideias,lab,vozes,arg,crono:crono.length>=3?crono:[],termos,desc,quando:agora()};
}

    const sn=M.snap,lt=!sn||sn.inval?(sn&&sn.inval?'<span class="note">Este parágrafo começou com uma sugestão da IA: não há Localização da ideia aqui.</span>':""):!g.a||!g.a.length?'<span class="note">A IA não indicou um trecho reconhecível no parágrafo; sem Localização da ideia desta vez.</span>':!sn.u.length?'<span class="note">Para ver a Localização da ideia, marque no parágrafo, antes de comparar, as palavras de onde tirou a sua etiqueta.</span>':`<span class="loc">${locTexto(locCalc(sn.u,g.a))}</span><span class="note">Em verde, o trecho que a IA usou; em azul, onde vocês coincidiram. A marcação da IA é uma referência, não um gabarito.</span>`;
    box.innerHTML=`<div class="fb stack" style="gap:6px"><span><b>Sua:</b> ${esc(tag.value.trim())}</span><span><b>IA:</b> ${esc(g.txt)}</span>${lt}
      <span class="note">A ideia é a mesma? Se a sua deixou algo importante de fora, ajuste. Se as duas dizem o mesmo, fique com a sua.</span>
      <div class="row"><button class="btn small primary" id="eiaMin">Manter a minha</button><button class="btn small" id="eiaUsa">Usar a da IA</button><button class="btn small" id="eiaEd">Editar a partir da IA</button></div></div>`;
    $("#eiaMin").onclick=()=>{box.innerHTML='<p class="note">Etiqueta mantida. Ela conta como sua.</p>';tag.focus()};
    $("#eiaUsa").onclick=()=>{tag.value=g.txt;tag.oninput();box.innerHTML='<p class="note">Etiqueta da IA no campo. Ela fica marcada como da IA.</p>'};
    $("#eiaEd").onclick=()=>{tag.value=g.txt;tag.oninput();g.antes=true;box.innerHTML='<p class="note">Edite a sugestão com as suas palavras.</p>';tag.focus()}};
  const pedir=async antes=>{if(!CAP.sample)return;bc.disabled=true;bs.disabled=true;box.innerHTML='<p class="note"><span class="spin"></span>Lendo o parágrafo…</p>';
    try{const r=await CAP.sample(promptEtq(S,i),{modelTier:"quick",maxTokens:160,cache:false});const lr=lerEtqIA(r&&r.text),t=lr.tag;if(!t)throw {code:"empty_completion"};
      const ia=trechoIdx(S.pars[i].t,lr.trecho);
      if(!M.snap)M.snap=antes?{inval:true}:{u:mk?mk.u():[]};
      est.sug={k,txt:t,antes,a:ia};if(mk)mk.setA(ia);
      const lc=M.snap&&!M.snap.inval&&M.snap.u.length&&ia.length?locCalc(M.snap.u,ia):null;
      logEv("etqia",{est:est.id,sec:S.n,i,modo:antes?"sugestao":"comparar",loc:lc?lc.pct:null});salvarResp(S);
      if(antes){tag.value=t;tag.oninput()}mostrar()}
    catch(e){box.innerHTML=`<p class="note" style="color:var(--bad)">${esc(sampleMsg(e))}</p>`}
    bc.disabled=!tag.value.trim();bs.disabled=false};
  bc.onclick=()=>{if(tag.value.trim())pedir(false)};bs.onclick=()=>pedir(!tag.value.trim());mostrar()}

/* 2 · Leitura ativa */
function pLeitura(S,el){const b=corpo(S),R=S.resp;R.etq=R.etq||{};R.gloss=arr(R.gloss);
  if(est.li>b.length)est.li=b.length;
  const barL=()=>navBar(b.length,est.li,k=>!!R.etq[b[k]],k=>`Parágrafo ${k+1} · p. ${S.pars[b[k]].pg}${R.etq[b[k]]?" · "+R.etq[b[k]]:""}`,"Resumo da seção");
  const irPara=k=>{pararVoz();est.li=Math.max(0,Math.min(k,b.length));R.li=est.li;est.lph="read";est.verSec=false;est.sug=null;salvarResp(S);pLeitura(S,el);
    const t=el.querySelector(".steps.nav");if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView({block:"start"})};
  const ligarNav=()=>{el.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>irPara(+x.dataset.nav));
    const vs=el.querySelector("#vsec");if(vs)vs.onclick=()=>{pararVoz();est.verSec=true;pLeitura(S,el)};
    const pa=el.querySelector("#pant");if(pa)pa.onclick=()=>irPara(est.li-1)};
  const botaoSec=`<button class="btn small" id="vsec" aria-label="Ver o texto inteiro da seção, páginas ${S.pgIni} a ${S.pgFim}">Ver a seção inteira (p. ${S.pgIni}–${S.pgFim})</button>`;
  if(est.verSec){
    let ult=null,html="";
    S.pars.forEach((p,j)=>{if(p.pg!==ult){if(ult!==null)html+=`<span class="pgsep">p. ${p.pg}</span>`;ult=p.pg}
      if(p.h){html+=`<p class="sh">${esc(p.t)}</p>`;return}
      const k=b.indexOf(j);html+=`<p class="sp${k===est.li?" atual":""}${p.q?" q":""}" data-sp="${k}" title="Estudar este parágrafo"><span class="pn">${k+1}</span>${esc(p.t)}${R.etq[j]?'<span class="ok" aria-label="etiqueta escrita">✓</span>':""}</p>`});
    el.innerHTML=`${barL()}<div class="navpar"><button class="btn small primary" id="vsx">← Voltar ${est.li<b.length?"ao parágrafo "+(est.li+1):"ao resumo"}</button><span class="note">Toque num parágrafo para estudá-lo.</span></div>
    <div class="passage secinteira"><span class="label">Seção inteira · ${b.length} parágrafos · p. ${S.pgIni}–${S.pgFim}</span>${html}</div>
    ${S.notas.length?`<details><summary>Notas de rodapé da seção (${S.notas.length})</summary>${S.notas.map(n=>`<p class="note-t"><span class="pgref">p. ${n.pg}</span> ${esc(n.t)}</p>`).join("")}</details>`:""}
    <div class="row"><button class="btn small" id="vsx2">← Voltar ${est.li<b.length?"ao parágrafo "+(est.li+1):"ao resumo"}</button></div>`;
    const volta=()=>{pararVoz();est.verSec=false;pLeitura(S,el)};$("#vsx").onclick=volta;$("#vsx2").onclick=volta;
    el.querySelectorAll("[data-sp]").forEach(x=>x.onclick=()=>{const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;irPara(+x.dataset.sp)});
    ligarNav();const at=el.querySelector(".sp.atual");if(at)setTimeout(()=>at.scrollIntoView({block:"center"}),0);return}
  if(est.li>=b.length){
    const LV=b.filter(i=>R.marc&&R.marc[i]&&R.marc[i].loc),LM=LV.length?Math.round(LV.reduce((s,i)=>s+R.marc[i].loc.pct,0)/LV.length):null;
    el.innerHTML=`${barL()}<div class="navpar">${botaoSec}</div><h2>Resumo da seção nas suas palavras</h2>${b.some(i=>R.etq[i])?`<ol class="resumo">${b.filter(i=>R.etq[i]).map(i=>`<li>${esc(R.etq[i])}${pg(S,i)}${(R.eorig||{})[i]==="ia"?' <span class="pill keep">da IA</span>':(R.eorig||{})[i]==="misto"?' <span class="pill keep">a partir da IA</span>':""}${R.marc&&R.marc[i]&&R.marc[i].loc?` <span class="pill loc">localização ${R.marc[i].loc.pct}%</span>`:""}</li>`).join("")}</ol>`:'<p class="note">Nenhuma etiqueta escrita.</p>'}
    ${LM!==null?`<div class="fb"><b class="loc">Localização da ideia nesta seção: ${LM}%</b> <span class="note">Média de ${LV.length} ${LV.length===1?"parágrafo":"parágrafos"} em que você marcou o texto e comparou a sua etiqueta com a da IA. Mede o quanto a região que você marcou coincide com a da IA (coincidências ÷ palavras marcadas por um ou pelos dois). Parágrafos que começaram com uma sugestão da IA não entram.</span></div>`:""}
    <p class="note">Estas etiquetas entram no fichamento. Dá para reescrever qualquer uma voltando à leitura.</p>
    <div class="row"><button class="btn primary" id="nx">Próxima etapa</button><button class="btn" id="re">Ler de novo desde o início</button></div>`;
    $("#nx").onclick=()=>proximoPasso(S);$("#re").onclick=()=>{est.li=0;est.lph="read";S.resp.li=0;salvarResp(S);estSecao()};ligarNav();return}
  const i=b[est.li],P=S.pars[i];
  let sub="";for(let k=i-1;k>=0;k--){if(S.pars[k].h){sub=S.pars[k].t;break}if(!S.pars[k].h)break}
  const notas=S.notas.filter(n=>n.pg===P.pg);
  const bar=barL();
  if(est.lph==="read"){
    R.marc=R.marc||{};const MK=R.marc[i]=R.marc[i]||{u:[],a:[],snap:null};
    el.innerHTML=`${bar}<div class="navpar">${est.li>0?'<button class="btn small" id="pant">◀ Parágrafo anterior</button>':""}${botaoSec}</div>${sub?`<p class="subtitle">${esc(sub)}</p>`:""}<div class="passage${P.q?" q":""}"><span class="label">Parágrafo ${est.li+1} de ${b.length} · p. ${P.pg}${P.q?" · citação":""}</span><p id="parTx">${parMarcavel(P.t,new Set(MK.u||[]),new Set(MK.a||[]))}</p></div>
    <div class="mk-leg"><span><i class="lb-u"></i>Você</span><span id="mkLegA" hidden><i class="lb-a"></i>IA</span><span id="mkLegA2" hidden><i class="lb-b"></i>Os dois</span><button class="linkbtn" id="mkSel" type="button" hidden>Marcar a seleção</button><button class="linkbtn" id="mkLimpa" type="button" hidden>Limpar marcação</button></div>
    <p class="note">Marcador: toque nas palavras de onde você tirou a sua etiqueta, ou selecione um trecho. É opcional, e é o que permite medir a Localização da ideia.</p>
    ${notas.length?`<details><summary>Notas de rodapé da p. ${P.pg} (${notas.length})</summary>${notas.map(n=>`<p class="note-t">${esc(n.t)}</p>`).join("")}</details>`:""}
    ${CAP.sample?'<div class="stack"><div class="row"><button class="btn small" id="expl">Explique de outro jeito (em 15 s)</button><span class="note">Travou? Releia devagar antes.</span></div><div id="explBox"></div></div>':""}
    <div class="field"><label for="tag">Etiqueta: a ideia deste parágrafo em 3 a 8 palavras suas</label><input id="tag" autocomplete="off" value="${esc(R.etq[i]||load("etq_"+est.id+"_"+S.n+"_"+i,"")||"")}"></div>
    ${CAP.sample?`<div class="row"><button class="btn small" id="eia" ${(R.etq[i]||load("etq_"+est.id+"_"+S.n+"_"+i,""))?"":"disabled"}>Comparar com a IA</button><button class="linkbtn sutil" id="eiaSos">Não consigo resumir: pedir uma sugestão</button></div><div id="eiaBox" aria-live="polite"></div>`:""}
    <div class="row"><input id="gt" style="flex:1 1 12rem;min-width:0;font:1rem var(--f-read);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)" placeholder="Termo difícil neste parágrafo" aria-label="Termo difícil"><button class="btn small" id="ga">Pôr no glossário</button></div>
    <div class="row"><button class="btn primary" id="nx" ${R.etq[i]?"":"disabled"} title="Escreva a etiqueta para continuar">Guardar e esconder</button><button class="btn small" id="sk">${est.li+1<b.length?"Pular este parágrafo ▶":"Pular para o resumo ▶"}</button></div>`;
    est.t0=Date.now();ligarExpl(S,i);const tag=$("#tag");tag.oninput=()=>{save("etq_"+est.id+"_"+S.n+"_"+i,tag.value);$("#nx").disabled=!tag.value.trim();const ea=$("#eia");if(ea)ea.disabled=!tag.value.trim()};
    if(est.sug&&est.sug.k!==S.n+"_"+i)est.sug=null;const mk=ligarMarcador(S,i,R);ligarEtqIA(S,i,mk);
    tag.addEventListener("paste",()=>setTimeout(()=>{if(mk){const c=copiaIdx(P.t,tag.value);if(c.length){mk.addU(c);toast("Trecho copiado marcado no parágrafo. Tente reescrever a etiqueta com as suas palavras.")}}},0));
    tag.onkeydown=e=>{if(e.key==="Enter"&&tag.value.trim())$("#nx").click()};
    $("#ga").onclick=()=>{const t=$("#gt").value.trim();if(!t)return;if(!R.gloss.some(g=>norm(g.termo)===norm(t)))R.gloss.push({termo:t,p:i,sentido:""});$("#gt").value="";salvarResp(S);toast(`“${t}” foi para o glossário.`)};
    $("#nx").onclick=()=>{R.etq[i]=tag.value.trim();R.eorig=R.eorig||{};R.eorig[i]=origemEtq(S,i,R.etq[i]);est.sug=null;
      {const m=R.marc[i];m.loc=m.snap&&!m.snap.inval&&m.snap.u&&m.snap.u.length&&m.a&&m.a.length?locCalc(m.snap.u,m.a):null}logEv("paragrafo",{est:est.id,sec:S.n,i,ms:Date.now()-(est.t0||Date.now()),pal:R.etq[i].split(/\s+/).length});R.li=est.li;est.lph="ask";salvarResp(S);pLeitura(S,el)};
    $("#sk").onclick=()=>irPara(est.li+1);ligarNav();
    tag.focus({preventScroll:true});
  }else{
    const Q=S.gen&&S.gen.ideias.find(x=>x.i===i&&!sinal(S,"i"+i));
    const fim=()=>{est.li++;R.li=est.li;est.lph="read";salvarResp(S);window.scrollTo(0,0);pLeitura(S,el)};
    if(Q){const list=shuffle([Q.ok,...Q.no]);
      el.innerHTML=`${bar}<div class="hiddenbox">O parágrafo está escondido.</div><p class="q">Qual é a ideia central do parágrafo que você acabou de ler?</p>${optsHTML(list.map(esc))}<div id="fb" aria-live="polite"></div>`;
      const opts=list.map(esc);
      est.ta=Date.now();bindOpts(opts,esc(Q.ok),right=>{R.ide=R.ide||{};R.ide[i]=right;salvarResp(S);logEv("ideia",{est:est.id,sec:S.n,i,certo:right,ms:Date.now()-est.ta});
        $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${right?"ok":"bad"}">${right?"Isso.":"Não era essa."}</b> Sua etiqueta: <i>${esc(R.etq[i])}</i>. Se ela ficou longe da ideia central, ajuste ao rever.</div>
        <div class="row"><button class="btn primary" id="nx">Próximo parágrafo</button><button class="btn" id="rv">Rever e ajustar a etiqueta</button></div>${botaoSinal("i"+i)}</div>`;
        $("#nx").onclick=fim;$("#rv").onclick=()=>{est.lph="read";pLeitura(S,el)};ligarSinal(S,el,fim)});ligarNav();
    }else{
      el.innerHTML=`${bar}<div class="hiddenbox">O parágrafo está escondido. Sem olhar, diga para você mesmo a ideia central e compare com a sua etiqueta: <i>${esc(R.etq[i])}</i>.</div>
      <div class="row"><button class="btn primary" id="nx">Próximo parágrafo</button><button class="btn" id="rv">Rever e ajustar a etiqueta</button></div>`;
      $("#nx").onclick=fim;$("#rv").onclick=()=>{est.lph="read";pLeitura(S,el)};ligarNav();
    }
  }
}

/* 3 · Frases difíceis */
function realcar(frase,nuc){const set=new Set(nuc.split(/\s+/).map(norm).filter(w=>w.length>=3));
  return frase.split(/(\s+)/).map(w=>set.has(norm(w))?`<mark class="core">${esc(w)}</mark>`:esc(w)).join("")}
function pFrases(S,el){const L=S.gen.lab.filter((x,k)=>!sinal(S,"l"+k));
  if(est.fi>=L.length){S.resp.frases={c:est.fr.c,t:est.fr.t};salvarResp(S);
    el.innerHTML=`<div class="fb">${est.fr.t?`Você achou o núcleo de ${est.fr.c} de ${est.fr.t} frases.`:"Nenhuma frase restante."} Ao ler, procure primeiro o verbo principal e trate o que está entre vírgulas como desvio.</div><div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`;
    $("#nx").onclick=()=>proximoPasso(S);return}
  const X=L[est.fi],k=S.gen.lab.indexOf(X),opts=shuffle([X.ok,...X.no]).map(esc);
  el.innerHTML=`<p class="lead">Frases longas tiradas desta seção. Encontre o núcleo: quem faz o quê.</p>${stepsBar(L.length,est.fi)}<div class="passage"><p id="fr">${esc(X.frase)}</p></div><p class="q">Qual é o núcleo desta frase?</p>${optsHTML(opts)}<div id="fb" aria-live="polite"></div>`;
  bindOpts(opts,esc(X.ok),right=>{est.fr.t++;if(right)est.fr.c++;logEv("frase",{est:est.id,sec:S.n,certo:right});$("#fr").innerHTML=realcar(X.frase,X.ok);
    $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${right?"ok":"bad"}">${right?"Isso.":"Não é o núcleo."}</b> As palavras do núcleo estão marcadas na frase.</div><div class="row"><button class="btn primary" id="nx">Continuar</button></div>${botaoSinal("l"+k)}</div>`;
    const nx=()=>{est.fi++;pFrases(S,el)};$("#nx").onclick=nx;ligarSinal(S,el,nx)});
}

/* 4 · Vozes */
function pVozes(S,el){const V=S.gen.vozes,nome=Object.fromEntries(V.lista.map(x=>[x.id,x.nome]));
  const af=V.af.map((x,k)=>({...x,k})).filter(x=>!sinal(S,"v"+x.k));
  const mapa=()=>mapaVozes(V);
  el.innerHTML=`<p class="lead">De memória: de quem é cada ideia? Se precisar, abra o trecho, mas tente antes sem ele.</p>
  <details><summary>Mostrar o trecho</summary><div class="passage" style="margin-top:8px">${S.pars.map(p=>p.h?`<p class="subtitle">${esc(p.t)}</p>`:`<p>${esc(p.t)}</p>`).join("")}</div></details>
  <div>${af.map(x=>`<div class="claim"><span class="t">${esc(x.t)}</span><div class="roles">${V.lista.map(v=>`<button class="chip" data-c="${x.k}" data-v="${esc(v.id)}" aria-pressed="${est.va[x.k]===v.id}" ${est.vok?"disabled":""}>${esc(v.nome)}</button>`).join("")}</div><span class="res">${est.vok?(est.va[x.k]===x.v?'<b style="color:var(--ok)">Certo.</b>':`<b style="color:var(--bad)">É de ${esc(nome[x.v])}.</b>`)+(x.p!=null?pg(S,x.p):""):""}</span>${est.vok?botaoSinal("v"+x.k):""}</div>`).join("")}</div>
  ${est.vok?`${mapa()}<div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`:`<div class="row"><button class="btn primary" id="chk" ${af.every(x=>est.va[x.k])?"":"disabled"}>Conferir</button></div>`}`;
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{est.va[b.dataset.c]=b.dataset.v;pVozes(S,el)});
  if($("#chk"))$("#chk").onclick=()=>{est.vok=true;const c=af.filter(x=>est.va[x.k]===x.v).length;S.resp.vozes={c,t:af.length};logEv("vozes",{est:est.id,sec:S.n,c,tt:af.length});salvarResp(S);pVozes(S,el)};
  if($("#nx"))$("#nx").onclick=()=>proximoPasso(S);
  ligarSinal(S,el,()=>pVozes(S,el));
}

/* 5 · Argumento */
function argView(S,itens){const g=r=>itens.filter(x=>x.r===r);
  return `<div class="argview">${["tese","premissa","evidencia","conclusao"].map(r=>g(r).length?`<div><span class="role">${g(r).length>1?plural(PAPEIS[r]):PAPEIS[r]}</span>${g(r).map(x=>`<p>${esc(x.t)}${x.p!=null?pg(S,x.p):""}</p>`).join("")}</div>`:"").join("")}</div>`}
function pArg(S,el){const A=S.gen.arg.map((x,k)=>({...x,k})).filter(x=>!sinal(S,"a"+x.k));
  if(!est.am)est.am=shuffle(A.map(x=>x.k));
  const byK=Object.fromEntries(A.map(x=>[x.k,x])),ord=est.am.filter(k=>byK[k]);
  el.innerHTML=`<p class="lead">As frases que reconstroem o raciocínio desta seção estão embaralhadas. Diga o papel de cada uma.</p>
  <div>${ord.map(k=>{const x=byK[k];return `<div class="claim"><span class="t">${esc(x.t)}</span><div class="roles">${Object.keys(PAPEIS).map(p=>`<button class="chip" data-k="${k}" data-r="${p}" aria-pressed="${est.aa[k]===p}" ${est.aok?"disabled":""}>${PAPEIS[p]}</button>`).join("")}</div><span class="res">${est.aok?(est.aa[k]===x.r?'<b style="color:var(--ok)">Certo.</b>':`<b style="color:var(--bad)">É ${PAPEIS[x.r].toLowerCase()}.</b>`):""}</span>${est.aok?botaoSinal("a"+k):""}</div>`}).join("")}</div>
  ${est.aok?`${mapaArg(S,A)}<div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`:`<div class="row"><button class="btn primary" id="chk" ${ord.every(k=>est.aa[k])?"":"disabled"}>Conferir</button></div>`}`;
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{est.aa[b.dataset.k]=b.dataset.r;pArg(S,el)});
  if($("#chk"))$("#chk").onclick=()=>{est.aok=true;const c=A.filter(x=>est.aa[x.k]===x.r).length;S.resp.arg={c,t:A.length};logEv("argumento",{est:est.id,sec:S.n,c,tt:A.length});salvarResp(S);pArg(S,el)};
  if($("#nx"))$("#nx").onclick=()=>proximoPasso(S);
  ligarSinal(S,el,()=>pArg(S,el));
}

/* 6 · Cronologia */
function pCrono(S,el){const C=S.gen.crono;
  if(!est.co)est.co=shuffle(C.map((x,i)=>i));
  const certo=C.map((x,i)=>i).sort((a,b)=>(parseInt(C[a].a)||0)-(parseInt(C[b].a)||0)||a-b);
  if(!est.cok){
    el.innerHTML=`<p class="lead">De memória: ponha os acontecimentos desta seção do mais antigo para o mais recente.</p><ol class="orderlist" id="ol"></ol><div class="row"><button class="btn primary" id="chk">Conferir</button></div>`;
    orderList($("#ol"),est.co,i=>esc(C[i].e));
    $("#chk").onclick=()=>{est.cok=true;const c=est.co.filter((v,pos)=>v===certo[pos]).length;S.resp.crono={c,t:C.length};logEv("cronologia",{est:est.id,sec:S.n,c,tt:C.length});salvarResp(S);pCrono(S,el)};
  }else{
    el.innerHTML=`<div class="fb">${S.resp.crono.c} de ${S.resp.crono.t} na posição certa. A ordem correta:</div>
    <ol class="orderlist">${certo.map((i,pos)=>`<li class="${est.co[pos]===i?"right":"wrong"}"><span class="pos">${pos+1}</span><span class="txt"><span class="yr">${esc(C[i].a)}</span>${esc(C[i].e)}${C[i].p!=null?pg(S,C[i].p):""}</span></li>`).join("")}</ol>
    ${mapaTempo(ordAno(C),S)}
    <div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`;

  }
}

/* 7 · Glossário e notas */
function pFecho(S,el){const R=S.resp;R.gloss=arr(R.gloss);
  const sug=S.gen?S.gen.termos.filter(t=>!R.gloss.some(g=>norm(g.termo)===norm(t.termo))):[];
  const pend=R.gloss.filter(g=>!g.sentido);
  el.innerHTML=`<h2>Glossário desta seção</h2>
  ${R.gloss.length?`<ul class="gloss">${R.gloss.map((g,k)=>`<li><span class="gt"><b>${esc(g.termo)}</b>${g.sentido?": "+esc(g.sentido):' <span class="note">sem explicação ainda</span>'}${g.p!=null?pg(S,g.p):""}</span><button class="btn small" data-rm="${k}" aria-label="Tirar ${esc(g.termo)} do glossário">×</button></li>`).join("")}</ul>`:'<p class="note">Nenhum termo ainda. Os termos que você marcar na leitura aparecem aqui.</p>'}
  ${pend.length&&CAP.sample?`<div class="row"><button class="btn" id="exp">Explicar ${pend.length} termo${pend.length>1?"s":""} pelo contexto</button><span class="note" id="est"></span></div>`:""}
  ${sug.length?`<div class="stack"><p class="note">Termos que o Claude apontou nesta seção:</p><ul class="gloss">${sug.map((t,k)=>`<li><span class="gt"><b>${esc(t.termo)}</b>: ${esc(t.sentido)}${t.p!=null?pg(S,t.p):""}</span><button class="btn small" data-add="${k}">Incluir</button></li>`).join("")}</ul></div>`:""}
  <div class="field"><label for="obs">Minhas observações sobre esta seção (dúvidas, conexões com a pesquisa, o que discordo)</label><textarea id="obs">${esc(R.obs||"")}</textarea></div>
  <div class="row"><button class="btn primary" id="fim">${S.status==="concluida"?"Salvar":"Concluir a seção"}</button>${est.si<est.secoes.length-1?'<button class="btn" id="prox">Ir para a próxima seção</button>':""}</div>`;
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.gloss.splice(+b.dataset.rm,1);salvarResp(S);pFecho(S,el)});
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const t=sug[+b.dataset.add];R.gloss.push({termo:t.termo,sentido:t.sentido,p:t.p});salvarResp(S);pFecho(S,el)});
  const salvaObs=()=>{const v=$("#obs").value;if(v!==(R.obs||"")){R.obs=v;salvarResp(S)}};
  $("#obs").onblur=salvaObs;
  if($("#exp"))$("#exp").onclick=async()=>{salvaObs();$("#exp").disabled=true;$("#est").innerHTML='<span class="spin"></span>Explicando…';
    const tx=S.pars.map(p=>p.t).join("\n\n");
    try{const r=await CAP.sample.json(`Explique, em até 25 palavras cada, como o TRECHO abaixo usa cada termo da lista. Se o trecho não explica o termo, diga o sentido mais provável no contexto e comece com "Provavelmente". Responda só com JSON: [{"termo":"...","sentido":"..."}]
TERMOS: ${pend.map(g=>g.termo).join("; ")}

TRECHO:
${tx}`,{modelTier:"quick"});
      for(const x of arr(r)){const g=R.gloss.find(g=>norm(g.termo)===norm(x&&x.termo));if(g&&str(x.sentido)&&!g.sentido)g.sentido=x.sentido.trim()}
      salvarResp(S);pFecho(S,el);
    }catch(e){if($("#est"))$("#est").textContent=sampleMsg(e);if($("#exp"))$("#exp").disabled=false}};
  $("#fim").onclick=()=>{salvaObs();const era=S.status;S.status="concluida";salvarSec(S,{resp:R,status:"concluida",step:"fecho"});marcarStatus(S);
    const tudo=est.secoes.every(x=>x.status==="concluida");if(era!=="concluida")est.cele={t:S.titulo,tudo};
    if(era==="concluida")toast("Salvo.");estGo("estudo");
    if(tudo&&era!=="concluida")setTimeout(()=>{const r=$("#rbloco");if(r)r.scrollIntoView({block:"start",behavior:"smooth"})},60)};
  if($("#prox"))$("#prox").onclick=()=>{salvaObs();est.si++;const N=est.secoes[est.si];abrirPasso(N.status==="nova"?"mapa":(N.step||"mapa"))};
}

    ${P&&(P.para||P.termos)?`<div class="lic">${P.para?`<b>Licenciado para ${e(P.para)}.</b> `:""}${P.termos?e(P.termos):""}</div>`:""}</div>`;

const AVV={completa:1,parcial:.5,incompleta:0};
const COMP_ROT={ide:"Ideia central",frases:"Frases difíceis",vozes:"Vozes",arg:"Argumento",crono:"Cronologia",perg:"Compreensão",teste:"Teste"};
function indicesDe(secoes,meta){const soma={ide:[0,0],frases:[0,0],vozes:[0,0],arg:[0,0],crono:[0,0],perg:[0,0]};let cal=[],il=0,sub=0,eu=0,ia=0,mi=0;
  for(const S of secoes){const R=S.resp||{};
    Object.values(R.ide||{}).forEach(v=>{soma.ide[1]++;if(v)soma.ide[0]++});
    ["frases","vozes","arg","crono"].forEach(k=>{const x=R[k];if(x&&x.t){soma[k][0]+=x.c||0;soma[k][1]+=x.t}});
    Object.values(R.perg||{}).forEach(a=>{if(!a||!(a.av in AVV))return;const v=AVV[a.av];soma.perg[0]+=v;soma.perg[1]++;
      if(a.conf>=1&&a.conf<=3){const esp=(a.conf-1)/2;cal.push(Math.abs(esp-v));if(a.conf===3&&v<1)il++;if(a.conf===1&&v===1)sub++}});
    const eo=R.eorig||{};Object.keys(R.etq||{}).forEach(i=>{if(!R.etq[i])return;const o=eo[i]||"eu";if(o==="ia")ia++;else if(o==="misto")mi++;else eu++})}
  const partes={};Object.entries(soma).forEach(([k,[c,t]])=>{if(t)partes[k]={c:Math.round(c*10)/10,t,p:Math.round(100*c/t)}});
  const R0=(meta&&meta.resultados)||{},tf=R0.tardio||R0.pos;if(tf&&tf.t)partes.teste={c:tf.c,t:tf.t,p:Math.round(100*tf.c/tf.t),fase:R0.tardio?"tardio":"pos"};
  const ks=Object.keys(partes),comp=ks.length?Math.round(ks.reduce((s,k)=>s+partes[k].p,0)/ks.length):null;
  const calib=cal.length?{p:Math.round(100*(1-cal.reduce((a,b)=>a+b,0)/cal.length)),n:cal.length,ilusao:il,subestima:sub}:null;
  const net=eu+ia+mi,auton=net?{p:Math.round(100*(eu+mi*.5)/net),n:net,ia,misto:mi}:null;
  const feitas=secoes.filter(S=>S.status==="concluida").length;
  return {comp,partes,calib,auton,feitas,total:secoes.length}}
function faixaComp(p){return p==null?"":p>=80?"muito bom":p>=60?"bom":p>=40?"em construção":"inicial"}
function graficoRodadas(pts){if(pts.length<2)return "";const W=320,H=120,pl=28,pr=10,pt=10,pb=22,n=pts.length;
  const x=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),y=v=>pt+(100-v)*(H-pt-pb)/100;
  const ser=(k,cls)=>{const ps=pts.map((p,i)=>p[k]==null?null:[x(i),y(p[k])]).filter(Boolean);if(ps.length<1)return "";
    return `<polyline class="${cls}" fill="none" points="${ps.map(q=>q.join(",")).join(" ")}"/>${ps.map(q=>`<circle class="${cls}" cx="${q[0]}" cy="${q[1]}" r="3"/>`).join("")}`};
  return `<figure class="rgraf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do índice de compreensão por rodada">
    ${[0,50,100].map(v=>`<line class="rg-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="rg-t" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    ${pts.map((p,i)=>`<text class="rg-t" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.rot}</text>`).join("")}
    ${ser("calib","rg-cal")}${ser("comp","rg-comp")}</svg>
    <figcaption class="note rg-leg"><span><span class="rg-k rg-kc"></span>Compreensão</span><span><span class="rg-k rg-kl"></span>Calibração</span></figcaption></figure>`}
function blocoRodada(){const m=est.meta,I=indicesDe(est.secoes,m),n=m.rodada||1,fim=I.feitas===I.total,hist=arr(m.rodadas);

  ${I.calib&&(I.calib.ilusao||I.calib.subestima)?`<p class="note">${I.calib.ilusao?`<b>${I.calib.ilusao}</b> resposta${I.calib.ilusao>1?"s":""} marcada${I.calib.ilusao>1?"s":""} como “Seguro” não ${I.calib.ilusao>1?"estavam":"estava"} completa${I.calib.ilusao>1?"s":""}: são os pontos a reler primeiro. `:""}${I.calib.subestima?`<b>${I.calib.subestima}</b> resposta${I.calib.subestima>1?"s":""} marcada${I.calib.subestima>1?"s":""} como “Pouco seguro” ${I.calib.subestima>1?"estavam":"estava"} completa${I.calib.subestima>1?"s":""}: você sabe mais do que pensa.`:""}</p>`:""}`}
  ${hist.length?`<h3 class="subtitle">Rodadas deste material</h3>${graficoRodadas(pts)}
   <div class="tbl"><table><thead><tr><th>Rodada</th><th>Período</th><th>Perguntas</th><th>Compreensão</th><th>Calibração</th><th>Autonomia</th></tr></thead><tbody>
   ${hist.map(r=>`<tr><td>${r.n}</td><td>${new Date(r.ini).toLocaleDateString("pt-BR")}–${new Date(r.fim).toLocaleDateString("pt-BR")}</td><td>${r.novas?"novas":"mesmas"}</td><td class="num">${r.ind.comp==null?"—":r.ind.comp}</td><td class="num">${r.ind.calib?r.ind.calib.p:"—"}</td><td class="num">${r.ind.auton?r.ind.auton.p+"%":"—"}</td></tr>`).join("")}
   <tr><td>${n} <span class="note">atual</span></td><td>${new Date(m.rodadaIni||m.criado||agora()).toLocaleDateString("pt-BR")}–</td><td>${m.rodadaNovas?"novas":hist.length?"mesmas":"—"}</td><td class="num">${I.comp==null?"—":I.comp}</td><td class="num">${I.calib?I.calib.p:"—"}</td><td class="num">${I.auton?I.auton.p+"%":"—"}</td></tr></tbody></table></div>`:""}
  <div class="row" id="rnova"><button class="btn${fim?" primary":""}" id="rnovaBt">Nova rodada deste material</button><span class="note">Opcional. Guarda este resultado e recomeça as mesmas páginas com as respostas em branco.</span></div></div>`}
function ligarRodada(){const b=$("#rnovaBt");if(!b)return;b.onclick=()=>{const m=est.meta,podeNovas=!!CAP.sample&&!m.origem;

async function novaRodada(novas,manter){const m=est.meta,id=est.id,n=m.rodada||1,ind=indicesDe(est.secoes,m),b=$("#rok");if(b)b.disabled=true;

  const nome=g.vozes?Object.fromEntries(g.vozes.lista.map(x=>[x.id,x.nome])):{};
  return {S,resumo:corpo(S).filter(i=>etq[i]).map(i=>({t:etq[i],pg:S.pars[i].pg})),
    arg:g.arg?g.arg.filter((x,k)=>!sinal(S,"a"+k)):null,

    crono:arr(g.crono),gloss:arr(R.gloss).filter(x=>x.sentido),obs:(R.obs||"").trim(),perg:arr(S.perg).map((q,k)=>({q,a:(R.perg||{})[k]})).filter(x=>x.a&&x.a.r)}})}
const pgOf=(S,i)=>i!=null&&S.pars[i]?` (p. ${S.pars[i].pg})`:"";
function fichMD(){const m=est.meta,D=fichDados();let o=`# Fichamento: ${m.titulo}\n\n`;
  if(m.ref)o+=`${m.ref}\n\n`;o+=`${m.paginasEstimadas?"Páginas estimadas (texto sem paginação)":`Páginas ${m.pgIni}–${m.pgFim} do PDF`} · ${new Date().toLocaleDateString("pt-BR")}\n\n## Síntese (nas minhas palavras)\n\n${(m.sintese||"").trim()||"(a escrever)"}\n\n`;
  D.forEach((d,n)=>{const S=d.S;o+=`## ${n+1}. ${S.titulo} (p. ${S.pgIni}–${S.pgFim})\n\n`;
    if(d.resumo.length)o+=`### Resumo nas minhas palavras\n\n${d.resumo.map(x=>`- ${x.t} (p. ${x.pg})`).join("\n")}\n\n`;
    if(d.arg){o+=`### Argumento\n\n`;["tese","premissa","evidencia","conclusao"].forEach(r=>{const it=d.arg.filter(x=>x.r===r);if(it.length)o+=`**${it.length>1?plural(PAPEIS[r]):PAPEIS[r]}**\n\n${it.map(x=>`- ${x.t}${pgOf(S,x.p)}`).join("\n")}\n\n`})}
    if(d.rel.length)o+=`### Interlocutores\n\n${d.rel.map(x=>`- **${x.n}** (${x.r}): ${x.t}`).join("\n")}\n\n`;
    if(d.crono.length)o+=`### Cronologia\n\n${d.crono.slice().sort((a,b)=>(parseInt(a.a)||0)-(parseInt(b.a)||0)).map(x=>`- ${x.a}: ${x.e}${pgOf(S,x.p)}`).join("\n")}\n\n`;
    if(d.perg.length)o+=`### Compreensão\n\n${d.perg.map(x=>`- **${x.q.q}** (${NIVEL[x.q.n].toLowerCase()}): ${x.a.r}`).join("\n")}\n\n`;
    if(d.gloss.length)o+=`### Glossário\n\n${d.gloss.map(x=>`- **${x.termo}**: ${x.sentido}${pgOf(S,x.p)}`).join("\n")}\n\n`;
    if(d.obs)o+=`### Observações\n\n${d.obs}\n\n`});
  return o+"---\nArgumento, interlocutores e glossário foram preparados com ajuda do Claude a partir do texto. Confira no original antes de citar.\n"}
function mdHTML(md){const lines=md.split("\n"),out=[];let ul=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const l of lines){if(/^- /.test(l)){if(!ul){out.push("<ul>");ul=true}out.push(`<li>${inl(l.slice(2))}</li>`);continue}
    if(ul){out.push("</ul>");ul=false}
    if(/^### /.test(l))out.push(`<h3>${inl(l.slice(4))}</h3>`);else if(/^## /.test(l))out.push(`<h2>${inl(l.slice(3))}</h2>`);else if(/^# /.test(l))out.push(`<h1>${inl(l.slice(2))}</h1>`);
    else if(l==="---")out.push("<hr>");else if(l.trim())out.push(`<p>${inl(l)}</p>`)}
  if(ul)out.push("</ul>");return out.join("\n")}

  <div class="field"><label for="sin">Síntese do capítulo, nas suas palavras (5 a 10 linhas)</label><textarea id="sin">${esc(m.sintese||"")}</textarea></div>

  const nomeArq=(m.titulo||"fichamento").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,80)||"fichamento";
  const baixar=async(ext,data)=>{if(!CAP.dl){toast("Download indisponível aqui. Use “Copiar o texto”.");return}
    try{await CAP.dl.save({filename:`Fichamento - ${nomeArq}.${ext}`,data})}catch(e){if(e&&e.code!=="declined")toast("Não foi possível baixar o arquivo. Use “Copiar o texto”.")}};
  $("#md").onclick=()=>{m.sintese=$("#sin").value;baixar("md",fichMD())};
  $("#ht").onclick=()=>{m.sintese=$("#sin").value;baixar("html",`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc("Fichamento - "+m.titulo)}</title><style>body{font-family:Georgia,serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}h1,h2,h3{font-family:Arial,sans-serif}h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:#555}hr{margin:2rem 0}</style></head><body>${mdHTML(fichMD())}</body></html>`)};
  $("#mp").onclick=async()=>{if(!CAP.dl){toast("Download indisponível aqui.");return}try{await CAP.dl.save({filename:`Mapas - ${nomeArq}.html`,data:mapasHTMLDoc()})}catch(e){if(e&&e.code!=="declined")toast("Não foi possível baixar os mapas.")}};
  $("#cp").onclick=()=>{m.sintese=$("#sin").value;const t=fichMD();
    navigator.clipboard.writeText(t).then(()=>toast("Fichamento copiado."),()=>{const a=document.createElement("textarea");a.value=t;a.setAttribute("aria-label","Fichamento em texto");main.appendChild(a);a.select();toast("Selecionei o texto abaixo. Copie com Ctrl+C.")})};
}

/* ---------------- Relógio da sessão e tamanho da letra ---------------- */
let secs=0,run=false,clk=null;
function showClock(){$("#clock").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")}
$("#clockBtn").onclick=()=>{
  if(run){clearInterval(clk);run=false;$("#clockBtn").textContent=secs?"Continuar":"Iniciar sessão";return}
  run=true;$("#clockBtn").textContent="Pausar";
  clk=setInterval(()=>{secs++;showClock();if(secs===1200)$("#pause").hidden=false;if(secs===1500)$("#pause").hidden=true},1000);
};
$("#clock").ondblclick=()=>{secs=0;showClock();$("#pause").hidden=true};
$("#aa").onclick=()=>abrirPnl($("#pnl").hidden);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pnl").hidden)abrirPnl(false)});
aplicarPref();go();initCaps();
</script>
